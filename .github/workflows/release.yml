name: Release

# Push a tag like v1.0.1 to build + publish a GitHub Release with the Linux
# binaries attached — but only for tags whose commit is on main, so pushing
# a tag from a feature/beta branch doesn't spend CI minutes. Cut a release
# (or prerelease) from another branch by building locally instead
# (`make linux-all` + `gh release create`) — see README: "Local / beta
# releases". `workflow_dispatch` lets you run the same build on demand (e.g.
# from the Actions tab) regardless of branch, useful for testing the
# pipeline itself - those runs just produce downloadable workflow artifacts
# instead of a Release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Cheap check that runs before the expensive Docker cross-build matrix,
  # so a tag pushed from a non-main branch bails out here instead of paying
  # for the full build.
  gate:
    runs-on: ubuntu-latest
    outputs:
      on_main: ${{ steps.check.outputs.on_main }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          git fetch origin main --depth=1
          if git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "on_main=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: github.event_name == 'workflow_dispatch' || needs.gate.outputs.on_main == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux/arm64
            arch: arm64
          - platform: linux/amd64
            arch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Cross-build (${{ matrix.platform }})
        run: |
          docker buildx build --platform ${{ matrix.platform }} -f Dockerfile.linux -o type=local,dest=./dist .
          mv dist/imgui-test dist/imgui-test-linux-${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: imgui-test-linux-${{ matrix.arch }}
          path: dist/imgui-test-linux-${{ matrix.arch }}

  release:
    needs: [gate, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && needs.gate.outputs.on_main == 'true'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/imgui-test-linux-*
          generate_release_notes: true
